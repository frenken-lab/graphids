name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "graphids/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check graphids/ tests/

  artifact-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - name: Check frame artifacts and exact metrics
        run: python -m pytest -q tests/core/test_evaluation.py tests/core/test_metrics.py
