name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "graphids/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check graphids/ tests/ scripts/

  cpu-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU runtime and test dependencies
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Check scientific contracts and supported workflows
        run: python -m pytest -q -m "not gpu and not slurm"
