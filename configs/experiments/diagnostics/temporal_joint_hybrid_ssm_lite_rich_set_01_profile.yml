extends: ../_base/diagnostics.yml
experiment_name: temporal_joint_hybrid_ssm_lite_rich_set_01_profile
dataset: set_01
plan_id: temporal_joint_hybrid_profile_2026_09_28
stage: fit
resources:
  memory_gb: 96
  time_limit: 02:00:00
config:
  data:
    coverage_policy: diagnostic
    source:
      dataset: set_01
    batch_size: 512
    num_workers: 7
    pin_memory: true
    persistent_workers: true
  model:
    scale: small
    memory:
      enabled: true
      time_encoding_dim: 4
    backbone:
      type: ssm_lite
      layers: 1
      dropout: 0.1
    rhythm:
      enabled: true
    motif:
      enabled: true
      embedding_dim: 8
      time_dim: 8
  trainer:
    enable_checkpointing: true
  callbacks:
    best:
      class_path: graphids.core.callbacks.Sha256ModelCheckpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      init_args:
        dirpath: '{run_dir}/checkpoints'
        filename: best_model
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
