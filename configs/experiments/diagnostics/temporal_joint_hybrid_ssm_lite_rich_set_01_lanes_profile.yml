experiment_name: temporal_joint_hybrid_ssm_lite_rich_set_01_lanes_profile
dataset: set_01
seed: 42
plan_id: temporal_hybrid_lane_profile_2026_09_29
stage: fit
representation_cfg:
  kind: temporal
resources:
  cluster: pitzer
  partition: gpu
  accelerator: gpu
  cpus_per_worker: 8
  gpus_per_worker: 1.0
  memory_gb: 96
  time_limit: "02:00:00"
  account: pas1266
config:
  data:
    type: temporal_dm
    source:
      type: can_bus
      dataset: set_01
      seed: 42
      train_source_mode: mixed
      representation_cfg:
        kind: temporal
    batch_size: 512
    batch_mode: stream_lanes
    stream_lanes: 8
    chunk_size: 64
    num_workers: 0
    pin_memory: true
    persistent_workers: false
    val_warmup_events: 64
    test_warmup_events: 64
  model:
    type: temporal_hybrid
    scale: small
    objective: joint
    memory:
      type: tgn
      enabled: true
      reset_on_stream_end: true
      time_encoding_dim: 4
    backbone:
      type: ssm_lite
      layers: 1
      dropout: 0.1
    heads:
      classification: true
      next_id: true
      iat: true
      payload_delta: true
    anomaly:
      mode: nll
    rhythm:
      enabled: true
    motif:
      enabled: true
      length: 3
      embedding_dim: 8
      time_dim: 8
    loss_weights:
      classification: 1.0
      next_id: 0.2
      iat: 0.1
      payload_delta: 0.1
    anomaly_score_weights:
      next_id: 1.0
      iat: 1.0
      payload_delta: 1.0
  trainer:
    accelerator: auto
    devices: 1
    max_epochs: 3
    limit_train_batches: 100
    limit_val_batches: 25
    enable_checkpointing: false
    enable_progress_bar: false
    enable_model_summary: false
    num_sanity_val_steps: 0
  callbacks:
    profiler:
      class_path: graphids.core.callbacks.TemporalBatchProfilerCallback
      init_args:
        prefix: profile
        warmup_batches: 5
        log_every_n_batches: 10
        sync_cuda: true
  loss_fn:
    type: ce
