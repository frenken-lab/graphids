extends: ../_base/diagnostics.yml
experiment_name: temporal_joint_hybrid_ssm_lite_rich_set_01_lanes16_chunk32_large_profile
dataset: set_01
plan_id: temporal_hybrid_lane16_chunk32_large_profile_2026_09_29
stage: fit
resources:
  memory_gb: 24
  time_limit: 02:00:00
config:
  data:
    coverage_policy: diagnostic
    source:
      dataset: set_01
    batch_size: 512
    batch_mode: stream_lanes
    stream_lanes: 16
    chunk_size: 32
    num_workers: 4
    prebuild_batches: 8
    pin_memory: true
    persistent_workers: false
    drop_partial_lane_batches: true
  model:
    scale: large
    input:
      hidden: 128
      embedding_dim: 32
      dropout: 0.1
    memory:
      enabled: true
      time_encoding_dim: 8
    backbone:
      type: ssm_lite
      layers: 2
      dropout: 0.1
    rhythm:
      enabled: true
    motif:
      enabled: true
      embedding_dim: 16
      time_dim: 16
  trainer:
    enable_checkpointing: false
  callbacks:
    profiler:
      init_args:
        expected_train_events: 512
        fail_on_event_mismatch: true
    resources:
      class_path: graphids._mlflow.MLflowSystemMetricsSummaryCallback
      init_args:
        sampling_interval: 5
        tracking_dir: '{run_dir}/.graphids/system_metrics_mlflow'
