extends: ../_base/diagnostics.yml
experiment_name: temporal_joint_hybrid_ssm_lite_rich_set_01_lanes16_chunk32_triton_context_profile
dataset: set_01
plan_id: temporal_hybrid_triton_context_2026_10_01
stage: fit
resources:
  memory_gb: 24
  time_limit: 02:00:00
config:
  data:
    coverage_policy: diagnostic
    source:
      dataset: set_01
    batch_size: 512
    batch_mode: stream_lanes
    stream_lanes: 16
    chunk_size: 32
    num_workers: 0
    prebuild_batches: 0
    pin_memory: false
    persistent_workers: false
    drop_partial_lane_batches: true
  model:
    scale: small
    memory:
      enabled: true
      time_encoding_dim: 4
    backbone:
      type: ssm_lite
      layers: 1
      dropout: 0.1
    scan:
      rhythm_kernel: triton
      time_kernel: triton
      motif_writer: triton
    rhythm:
      enabled: true
    motif:
      enabled: true
      embedding_dim: 8
      time_dim: 8
  trainer:
    enable_checkpointing: false
  callbacks:
    profiler:
      init_args:
        expected_train_events: 512
        fail_on_event_mismatch: true
    resources:
      class_path: graphids._mlflow.MLflowSystemMetricsSummaryCallback
      init_args:
        sampling_interval: 5
        tracking_dir: '{run_dir}/.graphids/system_metrics_mlflow'
