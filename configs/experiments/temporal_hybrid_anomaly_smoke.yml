extends: _base/smoke_hybrid.yml
experiment_name: temporal_hybrid_anomaly_smoke
dataset: set_01
plan_id: temporal_hybrid_anomaly_smoke
stage: fit
config:
  data:
    coverage_policy: diagnostic
    source:
      dataset: set_01
      train_source_mode: attack_free
    batch_size: 64
  model:
    objective: anomaly
    memory:
      time_encoding_dim: 4
    backbone:
      type: ssm_lite
      layers: 1
      dropout: 0.0
    heads:
      classification: false
      next_id: true
      iat: true
      payload_delta: true
    anomaly:
      mode: nll
    rhythm:
      enabled: true
    motif:
      enabled: true
      length: 3
      embedding_dim: 4
      time_dim: 4
    loss_weights:
      next_id: 0.2
      iat: 0.1
      payload_delta: 0.1
    anomaly_score_weights:
      next_id: 1.0
      iat: 1.0
      payload_delta: 1.0
  trainer:
    limit_val_batches: 2
