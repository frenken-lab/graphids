experiment_name: temporal_hybrid_anomaly_smoke
dataset: set_01
seed: 42
plan_id: temporal_hybrid_anomaly_smoke
stage: fit
representation_cfg:
  kind: temporal
resources:
  cluster: pitzer
  partition: gpu
  accelerator: gpu
  cpus_per_worker: 8
  gpus_per_worker: 1.0
  memory_gb: 96
  time_limit: "02:00:00"
  account: pas1266
config:
  data:
    type: temporal_dm
    source:
      type: can_bus
      dataset: set_01
      seed: 42
      train_source_mode: attack_free
      representation_cfg:
        kind: temporal
    batch_size: 512
    val_warmup_events: 64
    test_warmup_events: 64
  model:
    type: temporal_hybrid
    scale: small
    objective: anomaly
    input:
      hidden: 32
      embedding_dim: 8
      dropout: 0.0
    memory:
      type: tgn
      enabled: true
      reset_on_stream_end: true
    backbone:
      type: ssm_lite
      layers: 1
      dropout: 0.0
    heads:
      classification: false
      next_id: true
      iat: true
      payload_delta: true
    loss_weights:
      next_id: 0.2
      iat: 0.1
      payload_delta: 0.1
    anomaly_score_weights:
      next_id: 1.0
      iat: 1.0
      payload_delta: 1.0
  trainer:
    accelerator: auto
    devices: 1
    max_epochs: 1
    limit_train_batches: 2
    limit_val_batches: 1
    enable_checkpointing: false
    enable_progress_bar: false
    enable_model_summary: false
    num_sanity_val_steps: 0
