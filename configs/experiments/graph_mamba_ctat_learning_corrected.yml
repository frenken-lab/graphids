extends: graph_mamba_ctat_learning.yml
experiment_name: graph_mamba_ctat_learning_corrected_next_run
# Future source-only selection. Does not redefine the completed epoch-4 run.
config:
  callbacks:
    checkpoint:
      init_args:
        monitor: val/source_min_vehicle_macro_ap
        mode: max
        save_last: false
    final_checkpoint:
      # Lightning 2.6 can skip save_last when the monitored metric does not improve.
      class_path: graphids.core.callbacks.Sha256ModelCheckpoint
      init_args:
        dirpath: "{run_dir}/checkpoints"
        filename: last
        monitor: null
        save_top_k: 1
        save_last: false
        every_n_epochs: 1
        save_on_train_epoch_end: true
        auto_insert_metric_name: false
        enable_version_counter: false
