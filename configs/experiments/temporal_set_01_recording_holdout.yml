extends: _base/comparisons.yml
experiment_name: temporal_set_01_recording_holdout
dataset: set_01
plan_id: recording_validation_2026_10_01
stage: fit
resources:
  time_limit: 08:00:00
config:
  data:
    coverage_policy: full
    source:
      dataset: set_01
      val_split: recordings
      split_seed: 42
    stream_lanes: 256
    chunk_size: 32
    num_workers: 2
    prebuild_batches: 2
    persistent_workers: true
    stream_execution: segmented
  model:
    scan:
      cuda_graph: true
      ssm_kernel: torch
  trainer:
    limit_train_batches: 1.0
    check_val_every_n_epoch: 1
