experiment_name: temporal_anomaly_vgae_hcrl_sa_train
dataset: hcrl_sa
seed: 42
plan_id: temporal_anomaly_final_2026_09_26
stage: fit
representation_cfg:
  kind: temporal
resources:
  cluster: pitzer
  partition: gpu
  accelerator: gpu
  cpus_per_worker: 8
  gpus_per_worker: 1.0
  memory_gb: 96
  time_limit: "12:00:00"
  account: pas1266
config:
  data:
    type: temporal_dm
    source:
      type: can_bus
      dataset: hcrl_sa
      seed: 42
      train_source_mode: attack_free
      representation_cfg:
        kind: temporal
    batch_size: 512
    val_warmup_events: 64
    test_warmup_events: 64
  model:
    type: temporal_vgae
    scale: small
    kl_weight: 0.01
  trainer:
    accelerator: auto
    devices: 1
    max_epochs: 20
    enable_checkpointing: true
    enable_progress_bar: false
    enable_model_summary: false
    num_sanity_val_steps: 0
  callbacks:
    best:
      class_path: graphids.core.callbacks.Sha256ModelCheckpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      init_args:
        dirpath: "{run_dir}/checkpoints"
        filename: best_model
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
