experiment_name: temporal_anomaly_hybrid_ssm_lite_rich_set_02_train
dataset: set_02
seed: 42
plan_id: temporal_anomaly_hybrid_final_2026_09_27
stage: fit
representation_cfg:
  kind: temporal
resources:
  cluster: pitzer
  partition: gpu
  accelerator: gpu
  cpus_per_worker: 8
  gpus_per_worker: 1.0
  memory_gb: 96
  time_limit: "12:00:00"
  account: pas1266
config:
  data:
    type: temporal_dm
    source:
      type: can_bus
      dataset: set_02
      seed: 42
      train_source_mode: attack_free
      representation_cfg:
        kind: temporal
    batch_size: 512
    num_workers: 7
    pin_memory: true
    persistent_workers: true
    val_warmup_events: 64
    test_warmup_events: 64
  model:
    type: temporal_hybrid
    scale: small
    objective: anomaly
    memory:
      type: tgn
      enabled: true
      reset_on_stream_end: true
      time_encoding_dim: 4
    backbone:
      type: ssm_lite
      layers: 1
      dropout: 0.1
    heads:
      classification: false
      next_id: true
      iat: true
      payload_delta: true
    anomaly:
      mode: nll
    rhythm:
      enabled: true
    motif:
      enabled: true
      length: 3
      embedding_dim: 8
      time_dim: 8
    loss_weights:
      classification: 1.0
      next_id: 0.2
      iat: 0.1
      payload_delta: 0.1
    anomaly_score_weights:
      next_id: 1.0
      iat: 1.0
      payload_delta: 1.0
  trainer:
    accelerator: auto
    devices: 1
    max_epochs: 20
    enable_checkpointing: true
    enable_progress_bar: false
    enable_model_summary: false
    num_sanity_val_steps: 0
  callbacks:
    best:
      class_path: graphids.core.callbacks.Sha256ModelCheckpoint
      monitor: val_loss
      mode: min
      save_top_k: 1
      init_args:
        dirpath: "{run_dir}/checkpoints"
        filename: best_model
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
