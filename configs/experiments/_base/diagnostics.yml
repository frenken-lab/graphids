# Shared settings; launch an experiment leaf, not this partial config.
seed: 42
representation_cfg:
  kind: temporal
resources:
  cluster: pitzer
  partition: gpu
  accelerator: gpu
  cpus_per_worker: 8
  gpus_per_worker: 1.0
  account: pas1266
config:
  data:
    type: temporal_dm
    source:
      type: can_bus
      seed: 42
      train_source_mode: mixed
      representation_cfg:
        kind: temporal
    val_warmup_events: 64
    test_warmup_events: 64
  model:
    type: temporal_hybrid
    objective: joint
    memory:
      type: tgn
      reset_on_stream_end: true
    heads:
      classification: true
      next_id: true
      iat: true
      payload_delta: true
    anomaly:
      mode: nll
    motif:
      length: 3
    loss_weights:
      classification: 1.0
      next_id: 0.2
      iat: 0.1
      payload_delta: 0.1
    anomaly_score_weights:
      next_id: 1.0
      iat: 1.0
      payload_delta: 1.0
  trainer:
    accelerator: auto
    devices: 1
    max_epochs: 3
    limit_train_batches: 100
    limit_val_batches: 25
    enable_progress_bar: false
    enable_model_summary: false
    num_sanity_val_steps: 0
  callbacks:
    profiler:
      class_path: graphids.core.callbacks.TemporalBatchProfilerCallback
      init_args:
        prefix: profile
        warmup_batches: 5
        log_every_n_batches: 10
        sync_cuda: true
  loss_fn:
    type: ce
