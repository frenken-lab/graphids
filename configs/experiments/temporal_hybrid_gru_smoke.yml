extends: _base/smoke_hybrid.yml
experiment_name: temporal_hybrid_gru_smoke
dataset: set_01
plan_id: temporal_hybrid_gru_smoke
stage: fit
config:
  data:
    coverage_policy: diagnostic
    source:
      dataset: set_01
      train_source_mode: mixed
    batch_size: 512
  model:
    objective: supervised
    backbone:
      type: gru
      layers: 1
      dropout: 0.0
    heads:
      classification: true
  loss_fn:
    type: ce
  trainer:
    limit_val_batches: 1
