# Single-A100 per-ID timing-gap candidate selected by the October 30 ablations.
experiment_name: graph_mamba_events_id_gap_seed42
dataset: pooled_can
seed: 42
stage: fit
representation_cfg:
  kind: can_event
  schema_version: 2
resources:
  cluster: ascend
  partition: nextgen
  accelerator: gpu
  cpus_per_worker: 4
  gpus_per_worker: 1
  gres: gpu:a100:1
  memory_gb: 64
  time_limit: "02:00:00"
  account: pas1266
config:
  model:
    type: event_graph_mamba
    schema_version: 2
    use_id_gap: true
    positive_weight: 1.0
    max_graph_tokens: 8388608
    width: 128
    layers: 2
    backend: official
    dropout: 0.1
    # Frame BCE plus normal-only categorical byte likelihood.
    payload_weight: 1.0
    node_capacity: 512
  data:
    type: can_event_dm
    manifest_path: /fs/ess/PAS1266/graphids/dev/rf15/experimentruns/graph-mamba-multiattack-review-v1/can-recording-manifest-v1.json
    datasets: [set_01, set_03]
    cache_root: /fs/ess/PAS1266/graphids/dev/rf15/experimentruns/graph-mamba-events-source-v1/cache
    representation_cfg:
      kind: can_event
      schema_version: 2
    chunk_events: 16384
    stream_batch_size: 1
    effective_batch_events: 65536
    max_microbatch_events: 65536
    num_workers: 2
    prefetch_factor: 2
    persistent_workers: true
    cuda_prefetch: false
    pin_memory: true
  trainer:
    accelerator: gpu
    devices: 1
    max_epochs: 25
    precision: 32-true
    use_distributed_sampler: false
    num_sanity_val_steps: 2
    log_every_n_steps: 50
  callbacks:
    checkpoint:
      class_path: graphids.callbacks.Sha256ModelCheckpoint
      init_args:
        dirpath: "{run_dir}/checkpoints"
        monitor: val/classification_frame_ap
        mode: max
        save_top_k: 1
        save_last: true
