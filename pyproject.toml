[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphids"
version = "2.0.0"
description = "CAN intrusion detection with shared graph-Mamba models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8.0,<2.9",
    "lightning>=2.6",
    "torchmetrics>=1.8.0",
    "numpy>=1.26.4",
    "polars>=1.0.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "psutil>=6.0.0",
    "typer>=0.12",
    "nvidia-ml-py>=11.5",
    "mlflow-skinny>=2.17",
    "filelock>=3.13",
    "structlog>=24.0",
    "ray[train]>=2.55",
]

[project.optional-dependencies]
mamba = [
    "mamba-ssm @ git+https://github.com/state-spaces/mamba.git@10b5d6358f27966f6a40e4bf0baa17a460688128",
    "causal-conv1d==1.6.1",
    "transformers>=4.41,<5",
    "ninja>=1.11",
    "packaging>=24",
    "setuptools>=70",
    "wheel>=0.44",
]
analysis = ["umap-learn>=0.5", "seaborn>=0.13", "torch-cka>=0.21", "huggingface-hub>=0.24"]
dev = ["pytest>=7.0.0", "httpx>=0.27", "ruff>=0.4"]
db = ["psycopg[binary]>=3.1"]
decoding = [
    "cantools>=42,<43",
]
causal-diagnostic = ["pgmpy>=1.1,<2"]

[project.scripts]
graphids = "graphids.__main__:main"
gx = "graphids.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["graphids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (>30s, deselect with '-m not slow')",
    "slurm: marks tests that require SLURM submission (torch imports, CUDA, full training)",
]
filterwarnings = [
    "ignore:Can't initialize NVML:UserWarning:torch.cuda",
    "ignore:.*torch_geometric.distributed.*has been deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E402", "E741", "W291", "W292", "W293", "F541", "B905", "B017"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchmetrics.*",
]
ignore_missing_imports = true
